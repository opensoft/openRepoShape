name: tests

# The suite scaffolds into BARE REPOSITORIES IN A TEMPORARY DIRECTORY and
# clones them over the filesystem. It never calls `gh`, never touches the
# network, and must never create a real repository.
#
# The FULL suite runs on LINUX ONLY, on every trigger: a push to `main` or to a
# release branch (`release/v<major>.<minor>`), a pull request and a manual run
# all use the one ubuntu job below. Brett Heap decided on 2026-10-15, for the
# whole estate, to drop the macOS and Windows test jobs.
# One exception, on Brett Heap's word at 2026-10-15T18:20:35Z,
# "Option 1: keep a small Git Bash job for #596": the `tests-git-bash` job
# below runs the launcher's and the installer's suites, and nothing else, on
# Windows under Git Bash.
#
# A RELEASE BRANCH'S PUSHES RUN IT TOO (#850). A patch is tagged on its
# `release/v<major>.<minor>` branch, and `release.yml` releases a commit only
# once a push or dispatch run of this workflow passed `tests` on it, so a
# commit a release branch takes gets that run from its own push, with no
# dispatch by hand. `release/v*` takes each of them, and any other name of one
# segment that starts `release/v`: in a branch filter `*` matches no `/`.
# A push runs the tests.yml its own commit holds, so a release branch runs it
# only once it holds this change: `release/v1.1` from its first fast-forward
# past it, or a cherry-pick of it; `release/v1.0` never has, and still needs a
# dispatch.
#
# The `package` job at the end runs no pytest. It builds the openreposhape
# wheel and installs it with pipx, so what it checks needs PyPI (the build
# backend, git-filter-repo; #563). The other jobs take only test tools there.

on:
  push:
    branches: [main, 'release/v*']
  pull_request:
  workflow_dispatch:

# A RUN IS CANCELLED ONLY BY A NEWER RUN IN ITS OWN GROUP: a newer push to the
# same pull request, or a second dispatch of the same ref at the same commit.
# A pull request's group is its ref and its number. A `push` run on main has
# no number, and the old fallback `github.ref` put every one of them in the
# one group `tests-refs/heads/main`, so each landing cancelled the run on the
# main before it: on 2026-10-15 every push run from #561 (7d9bec9) to #580
# (dd3f23a) ended `cancelled` and nine PRs landed with no Linux run over their
# combination (#592). `github.sha` gives a push run a group of its own commit,
# so no later landing cancels it and each landing keeps its own Linux result.
# `github.event_name` keeps a push run and a dispatch apart, so a dispatch on
# main, which runs on whatever commit main is at, never cancels that commit's
# push run; a second dispatch of the same ref at the same commit still
# replaces the first.
#
# `github.ref` KEEPS TWO BRANCHES APART AT ONE COMMIT (#850). A group spans
# the repository, not a branch, and a push run's `github.sha` is the commit
# the push left its branch at. Without the ref, a fast-forward of
# `release/v1.1` to main's commit shares the group of main's push run on that
# commit and cancels it while it is still running, as #592's landings did.
# The ref sits beside the commit, never in its place as #592's fallback did.
# A pull request's ref, `refs/pull/<number>/merge`, is its own, so a pull
# request still has one group, and a newer push to it still cancels the older
# run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # ubuntu-24.04, NOT ubuntu-latest (#1096). The Ubuntu 26.04 that
  # `ubuntu-latest` now gives out runs this suite out of disk: #1092's run of
  # this job (job 119050702775, image `ubuntu-26.04` version 20261012.163.1)
  # ended `2436 failed, 11382 passed, 380 skipped, 5579 errors in 3048.23s`,
  # with 28325 lines of `[Errno 122] Disk quota exceeded`, and later `No space
  # left on device`, all under pytest's basetemp in /tmp,
  # `/tmp/pytest-of-runner/pytest-0`. The same job passed on 24.04. It stays
  # on 24.04 until the suite runs on 26.04, which #1096 tracks.
  tests:
    runs-on: ubuntu-24.04
    steps:
      # PINNED BY COMMIT, not by tag — the rule this repository spends a
      # whole README section on. A tag can be moved and a commit cannot.
      #
      # FULL HISTORY: kept for any `git log`/history-based provenance check
      # this suite might grow, even though it no longer matters for
      # `tests/test_repo_hygiene.py::test_the_handbook_follows_the_readmes_
      # outline` itself — #91 moved that check from diffing against a named
      # commit to hashing the working tree's own README.md, and #519 to one
      # hash per README `## ` section, each recorded by the handbook section
      # that reads it. Neither needs history, and both run the same in a
      # shallow clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.x'

      # pytest is the TEST RUNNER and is the only thing installed here.
      # Nothing this repository SHIPS may import anything outside the standard
      # library — `tests/test_repo_hygiene.py::test_shipped_code_imports_only_
      # the_standard_library` is what enforces that, and it would fail if a
      # validator or the scaffold ever grew a dependency.
      # PINNED, both of them. A CI job that resolves "latest" on every run
      # is a job whose result depends on the day it ran, which is the same
      # objection this standard makes to pinning a tag instead of a commit.
      - name: install the test runner
        run: python3 -m pip install --disable-pip-version-check pytest==8.3.4

      # `git filter-repo` is what `adopt-project.py` extracts a leg's history
      # with, and it is a REQUIREMENT rather than a vendored copy: history
      # extraction has one correct implementation. It is a test-environment
      # dependency here in exactly the way it is a runtime dependency there —
      # the adoption suite SKIPS without it, so this step is what stops the
      # end-to-end tests from quietly not running.
      - name: install git-filter-repo
        run: |
          python3 -m pip install --disable-pip-version-check \
              git-filter-repo==2.47.0

      # Per-invocation identity, never `git config --global`: a lane that
      # mirrors this step on a workstation must not be able to rewrite the
      # operator's ~/.gitconfig (it happened on 2026-09-03). The scaffold,
      # adopt, update-shape and the test fixtures all honour these variables.
      - name: git identity for the scaffolded commits (env, not global config)
        run: |
          {
            echo "GIT_AUTHOR_NAME=openRepoShape CI"
            echo "GIT_AUTHOR_EMAIL=ci@openreposhape.invalid"
            echo "GIT_COMMITTER_NAME=openRepoShape CI"
            echo "GIT_COMMITTER_EMAIL=ci@openreposhape.invalid"
          } >> "$GITHUB_ENV"

      - name: tests
        run: python3 -m pytest tests -q

      # PINNED, checksum-verified, no `go install`/`pip` package exists for
      # this: a static release binary downloaded straight from the tag this
      # repository pins. This is what would have caught the `secrets`-in-a-
      # step-`if:` defect (a rendered workflow file GitHub itself rejects as
      # unparseable) before it ever reached a real project's pull request.
      - name: install actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl --proto '=https' --tlsv1.2 -sSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "${sha256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          chmod +x actionlint

      # THE TWO WORKFLOWS THIS REPOSITORY SHIPS INTO A PROJECT, AND THIS ONE.
      # `templates/assembly-root/.../validate.yml` and
      # `templates/family-root/.../validate.yml` are what a scaffolded
      # project or family holder runs, never this repository — until now
      # that was the whole list. #122/#124 added an `if:` guard on two jobs
      # and a `concurrency:` expression to `tests.yml` itself, with no lint
      # anywhere that would have caught a typo in either: the workflow
      # everybody here runs, on every push and pull request, was linted by
      # nothing. Handing actionlint its own path alongside the two templates
      # closes that gap without touching what it already checked. The
      # release workflow (#563) is linted here too, on every pull request,
      # because nothing else runs it before a release is dispatched.
      - name: actionlint — this workflow, the release workflow, and the two it ships into a project
        run: >-
          ./actionlint
          .github/workflows/tests.yml
          .github/workflows/release.yml
          templates/assembly-root/.github/workflows/validate.yml
          templates/family-root/.github/workflows/validate.yml

  # THE LAUNCHER'S AND THE INSTALLER'S SUITES ON WINDOWS, UNDER GIT BASH
  # (#585). README says Git Bash runs the `openRepoShape` command and the
  # one-line install, "tested in CI but for a typed `yes`", and this job is
  # what makes that true: `tests/test_openreposhape_command.py`,
  # `tests/test_install_sh.py` and `tests/test_install_sh_filter_repo.py`,
  # run here as Git Bash runs them.
  #
  # TWO SUITES, NOT THE WHOLE SUITE. #597 dropped the Windows job for the
  # whole estate, and this job is the one exception made to it (see the
  # header), so it runs what README's sentence claims and nothing more:
  # about a minute and a half (86 s on the first run, 50 s of it pytest),
  # beside the ubuntu job and not after it. No git-filter-repo, because
  # these suites never reach a real one (the install suite fakes it and
  # pipx, and the launcher's machine report gets a fake on the PATH it
  # builds), and no actionlint, which the ubuntu job runs on this file.
  #
  # THE BASH IS GIT'S OWN `usr\bin\bash.exe`, which `tests/conftest.py`
  # (`BASH`) finds from `git --exec-path` and never by name: a bare `bash`
  # runs System32's WSL launcher, which CreateProcess searches before PATH,
  # and `Git\bin\bash.exe`, the `bash` PATH names first on this image, puts
  # Git's real `curl` ahead of the suites' fake. conftest's comment there
  # has the rest.
  #
  # ON EVERY TRIGGER, a push to `main` or to a release branch included: a
  # squash lands a tree no pull-request run tested (#122), and these two
  # suites are the only run of the one-line install on Windows.
  tests-git-bash:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # The old Windows job's settings, which every Windows run of these
      # two suites has had, #585's probes included. Per-invocation git
      # config, never `git config --global`.
      #
      # PYTHONUTF8=1 (PEP 540): the suites read bash's output with
      # `text=True`, which decodes in the locale's code page (cp1252 here)
      # outside UTF-8 mode, and the launcher's `--help` is full of em dashes.
      #
      # core.autocrlf=false: Git for Windows' own default is `true`, and the
      # suites commit, clone and check out repositories of their own; no test
      # here asks for line-ending translation.
      #
      # core.longpaths=true: MAX_PATH is 260 characters, and the suites'
      # clones nest under pytest's temp root.
      PYTHONUTF8: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    steps:
      # The SAME two commits the ubuntu job pins. `fetch-depth: 0`, as the
      # ubuntu job has it: no test in these three files has cloned this
      # checkout since #942. A shallow checkout here is a change of its own,
      # and wants a Windows run behind it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.x'

      # `python`, not `python3`: a Windows install has no `python3`.
      - name: install the test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.4

      # Per-invocation identity, never `git config --global`. PowerShell is
      # the default shell on this runner, so the append is
      # `>> $env:GITHUB_ENV` rather than the ubuntu job's
      # `{ echo ... } >> "$GITHUB_ENV"` block.
      - name: git identity for the test repositories (env, not global config)
        run: |
          "GIT_AUTHOR_NAME=openRepoShape CI" >> $env:GITHUB_ENV
          "GIT_AUTHOR_EMAIL=ci@openreposhape.invalid" >> $env:GITHUB_ENV
          "GIT_COMMITTER_NAME=openRepoShape CI" >> $env:GITHUB_ENV
          "GIT_COMMITTER_EMAIL=ci@openreposhape.invalid" >> $env:GITHUB_ENV

      # GIT BASH, OR THIS JOB FAILS HERE. Where conftest finds no Git Bash,
      # both suites SKIP, and a job of skips would leave README's sentence a
      # claim again, so this step refuses first and prints the bash the
      # suites will run.
      - name: Git Bash is the bash the launcher and installer suites run
        run: python -c "import sys; sys.path.insert(0, 'tests'); from conftest import BASH; print(BASH); sys.exit(BASH is None)"

      # `-rA` names every test and its result in the log. `--basetemp` puts
      # pytest's temp root as near the drive root as a path the runner
      # guarantees allows: `runner.temp` is `D:\a\_temp` or `C:\a\_temp`,
      # and the default profile path is ~50 of MAX_PATH's 260 characters
      # before the suites' own nesting starts.
      #
      # The installer's suite is TWO FILES (#649): `tests/test_install_sh_
      # filter_repo.py` holds the git-filter-repo step and the two
      # readinesses step 3's one line ends with (#595), on
      # `tests/test_install_sh.py`'s fakes and set-up.
      - name: the launcher's and the installer's suites, under Git Bash
        run: python -m pytest -q -rA tests/test_openreposhape_command.py tests/test_install_sh.py tests/test_install_sh_filter_repo.py --basetemp=${{ runner.temp }}\t

  # THE openreposhape PACKAGE, BUILT AND INSTALLED AS A PERSON INSTALLS IT
  # (#563). A JOB OF ITS OWN, AND NO PYTEST IN IT: the build backend
  # `pyproject.toml` pins (hatchling) and git-filter-repo, the package's one
  # dependency, both come from PyPI, and the suite in the `tests` job above
  # never touches the network. What can be checked offline is checked there,
  # on Linux like the rest of the suite since #597
  # (`tests/test_openreposhape_package.py`); this job is what only a real
  # build and a real pipx can say.
  #
  # UBUNTU, ON THE OLDEST PYTHON THE PACKAGE SUPPORTS, 3.9. The wheel is pure
  # Python, one file for every system; the release workflow (#563's next
  # pull request) installs it on Linux, macOS and Windows before it uploads
  # anything.
  #
  # ubuntu-24.04, NOT ubuntu-latest (#1094). 3.9 is `requires-python`'s
  # floor, and the Ubuntu 26.04 that `ubuntu-latest` now gives out has no 3.9
  # build for setup-python: its manifest lists 3.10 to 3.15 there, and 3.8 to
  # 3.15 for 24.04. A run that landed on a 26.04 runner failed in setup-python
  # with `The version '3.9' with architecture 'x64' was not found for Ubuntu
  # 26.04.` The `tests` job above is on ubuntu-24.04 too, for a reason of its
  # own (#1096), and `tests-git-bash` runs on windows-latest. In release.yml,
  # `build` asks for `3.12` on ubuntu-latest, which 26.04 has.
  package:
    runs-on: ubuntu-24.04
    steps:
      # The same two commits the other jobs pin.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.9'

      # TWICE, AT THE COMMIT'S OWN TIME, AND THE TWO MUST BE ONE FILE: a
      # release uploads bytes it can build again. `--no-deps`, because the
      # wheel is this package alone; git-filter-repo arrives with the install.
      - name: build the wheel twice, and compare the two
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          for out in a b; do
            python -m pip wheel --disable-pip-version-check --no-deps \
                --wheel-dir "$RUNNER_TEMP/dist-$out" .
          done
          cmp "$RUNNER_TEMP"/dist-a/*.whl "$RUNNER_TEMP"/dist-b/*.whl
          sha256sum "$RUNNER_TEMP"/dist-a/*.whl

      # EVERY FILE IN THE WHEEL BUT ITS METADATA IS THIS COMMIT'S OWN, BYTE
      # FOR BYTE, read from git: the package's modules from `src/`, and
      # `setup-project.py`, which the wheel carries so that `--preflight`
      # runs before git is installed.
      - name: the wheel holds this commit's files, byte for byte
        run: |
          python - "$RUNNER_TEMP"/dist-a/*.whl <<'EOF'
          import subprocess, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as wheel:
              for name in wheel.namelist():
                  if ".dist-info/" in name:
                      continue
                  source = ("setup-project.py"
                            if name == "openreposhape/setup-project.py"
                            else "src/" + name)
                  committed = subprocess.run(
                      ["git", "show", "HEAD:" + source],
                      capture_output=True, check=True).stdout
                  if wheel.read(name) != committed:
                      sys.exit(f"{name} in the wheel is not {source} at HEAD")
                  print(f"{name} = HEAD:{source}")
          EOF

      # pipx AS A PERSON RUNS IT, into directories of this job's own, and ON
      # THE 3.9 ABOVE. Not the runner's own pipx with `--python`: that pipx
      # runs on the image's Python and shares ONE pip with every environment
      # it makes, a pip that no longer runs on 3.9 (`dataclass(slots=True)`,
      # this job's first run, 2026-10-15). So pipx itself runs on 3.9, at
      # 1.11.1, the newest release that installs there, and its shared pip
      # is then one that 3.9 runs. Wheels only (`--only-binary :all:`), so
      # installing pipx runs no package's setup script.
      - name: install the wheel with pipx
        run: |
          set -euo pipefail
          {
            echo "PIPX_HOME=$RUNNER_TEMP/pipx/home"
            echo "PIPX_BIN_DIR=$RUNNER_TEMP/pipx/bin"
          } >> "$GITHUB_ENV"
          export PIPX_HOME="$RUNNER_TEMP/pipx/home"
          export PIPX_BIN_DIR="$RUNNER_TEMP/pipx/bin"
          python -m pip install --disable-pip-version-check \
              --only-binary :all: pipx==1.11.1
          python -m pipx --version
          python -m pipx install "$RUNNER_TEMP"/dist-a/*.whl
          "$PIPX_HOME/venvs/openreposhape/bin/python" --version
          ls -l "$PIPX_BIN_DIR"

      # THE FIVE COMMANDS PIPX PLACED, AGAINST THIS COMMIT. A bare repository
      # on disk holds it as `main`, which an unstamped build follows, so
      # nothing is cloned from github.com. No git-filter-repo is on PATH, and
      # the doctor's machine row must still find the one pipx installed
      # beside the package: the PATH every command gives its children.
      - name: run the commands pipx placed
        env:
          OPENREPOSHAPE_REPO: ${{ runner.temp }}/standard.git
        run: |
          set -euo pipefail
          git init -q --bare --initial-branch=main "$OPENREPOSHAPE_REPO"
          git push -q "$OPENREPOSHAPE_REPO" HEAD:refs/heads/main
          export PATH="$PIPX_BIN_DIR:$PATH"
          if command -v git-filter-repo; then
            echo "::error::git-filter-repo is on PATH already, so this job cannot show the commands finding their own"
            exit 1
          fi
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          openRepoShape --version | tee "$out/version"
          grep -q '^openRepoShape 0.0.0 (.* @ main)$' "$out/version"
          openRepoShape --help >/dev/null
          status=0
          openRepoShape --install 2>"$out/install" || status=$?
          cat "$out/install"
          test "$status" -eq 2
          grep -q 'pipx upgrade openreposhape' "$out/install"
          openRepoShape --preflight --local-remote-dir "$RUNNER_TEMP/no-remotes"
          git init -q "$RUNNER_TEMP/empty"
          status=0
          openRepoShape --doctor "$RUNNER_TEMP/empty" --json \
              >"$out/doctor.json" || status=$?
          test "$status" -eq 2
          python - "$out/doctor.json" \
              "$PIPX_HOME/venvs/openreposhape/bin/git-filter-repo" <<'EOF'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          print("verdict:", report["verdict"])
          [machine] = [row for row in report["rows"] if row["id"] == "machine"]
          found = machine["detail"]["git-filter-repo"]
          print("machine row: git-filter-repo at", found)
          if found != sys.argv[2]:
              sys.exit(f"the doctor found git-filter-repo at {found!r}, "
                       f"not at {sys.argv[2]!r}")
          EOF
          for tool in scaffold-project adopt-project update-shape shape-doctor; do
            "$tool" --help >/dev/null
          done
