schema_version: 1
kind: repository-naming-policy

# ===========================================================================
# repository-naming.yaml — the four live naming families, as DATA.
#
# WHY DATA AND NOT PROSE. A convention written only in a README is checked by
# whoever remembers it. This file is read by `scripts/validate-repository-naming.py`,
# which the scaffold runs BEFORE it creates anything and which a scaffolded
# project's own pull-request gate runs over its manifest, so the convention is
# refused rather than regretted.
#
# THE FAMILIES CONFER NOTHING. A name is a name. Nothing in this file grants
# review authority, clearance eligibility, gate standing or lifecycle state
# over the repository it classifies — that is the ratified doctrine of
# `add-wallet-carried-review-authority` ("electing the schema changes no gate,
# no floor, no grant, and no clearance eligibility") and this file is bound by
# it. A consumer deriving a permission from a family id is defective.
#
# PRECEDENCE IS SEMANTIC, NOT COSMETIC — AND TWO KINDS OF FORM LIVE HERE.
#
# `neutral-product` and `install` are UNAMBIGUOUS BY CONSTRUCTION: `open` in
# front, `-Install` behind. Nothing else spells them, so they win outright and
# need nothing declared. Their precedence is unchanged.
#
# `domain-descendant` is not like that. `<Domainx><Product>` is a CLAIM OF
# DESCENT, and a claim needs a REFERENT. Ruled by Brett Heap on 2026-09-02:
#
#     "Descendant only if it pins open<Product>."
#
# A name is classified as a domain descendant ONLY when the project declares a
# pin on the matching `open<Product>` (see `referent:` in that family below).
# Without that pin the project's DECLARED ROLE wins: the name is a valid
# assembly root, and the fact that it ALSO matches the descendant form is
# RECORDED in the manifest's `naming.also_matches` rather than thrown away.
# With no declared role at all the name is reported as `project-leg/assembly`
# with `also_matches: [domain-descendant]`.
#
# WHY. Every project in a `<Domainx>` family organisation hits the overlap.
# `MedxSoft` holds `MedxEHR`, `MedxGlass`, `MedxScribe`; on the first real
# pilot the scaffold refused `MedxScribe` as "domain-descendant, not the
# assembly form of a project leg" — for a name that descends from nothing,
# because no `opensoft/openScribe` exists. Reading a claim as a fact made an
# ordinary project unscaffoldable in the one organisation shaped to have many.
#
# THE CHECK STAYS OFFLINE. The referent is a PIN THE PROJECT DECLARES, which is
# a fact in its own tree; classification never asks GitHub whether
# `open<Product>` exists. A rule that needed the network would be unrunnable
# in the fork-and-run case this whole standard is built for.
#
# `matches()` and `--explain` still report every form a name satisfies, so an
# overlap stays visible instead of being silently resolved.
#
# A DESCENDANT MAY CARRY LEGS. Ruled by Brett Heap on 2026-09-02, in the same
# breath as the referent rule: being a descendant and being a three-repository
# project are INDEPENDENT facts. `MedxGlass` descends from `openGlass` AND is
# the assembly root that mounts `MedxGlass-spec` and `MedxGlass-code`. The
# descendant family therefore declares no roles of its own but ADMITS the
# declared `assembly` role (`admits_declared_role:` below), so
# `form: domain-descendant, role: assembly, referent_declared: true` is a
# VALID classification for an assembly root. Reading the two rulings as
# exclusive would have forced every declared descendant into a one-repository
# project, which neither ruling says.
#
# THE ASSEMBLY-ROOT FORM IS THE RESIDUAL CLASS, deliberately. A bare CamelCase
# token is the widest form here and sits last on purpose: the staged fragment
# records that two live repositories (`xFactory-Installer`, `AgentTower`) fit
# no suffix rule at all, so this is a FORWARD rule and the residual class is
# where an unsuffixed name lands. What it does NOT admit is a name with a
# hyphen, an underscore, a dot or a space — those match nothing and are
# refused, which is the check that actually earns its keep.
# ===========================================================================

families:
  - id: neutral-product
    precedence: 1
    title: Neutral product
    pattern: "^open(?:[A-Z]|x[A-Z])[A-Za-z0-9]*$"
    description: >-
      A domain-neutral product repository: `open` followed by the product
      name. The character after `open` is uppercase, or the lowercase `x` of
      an x-stem followed by an uppercase letter — which is what keeps the
      organisation login `opensoft` from reading as a product.
    examples:
      - openxFactory
      - openXwallet
      - openChart
    counter_examples:
      - opensoft
      - OpenChart

  - id: install
    precedence: 2
    title: Install
    pattern: "^[A-Za-z][A-Za-z0-9]*(?:-[A-Za-z0-9]+)*-Install$"
    description: >-
      A deployable install or runtime repository, ending in the CamelCase
      suffix `-Install`. The stem may itself be hyphenated, which is how one
      product's install is qualified by the layer that owns it.
    examples:
      - xFactory-Hermes-Install
      - Hermes-Install
      - Keycloak-Install
    counter_examples:
      - hermes-install
      - Keycloak-Installer

  - id: domain-descendant
    precedence: 3
    title: Domain descendant
    pattern: "^[A-Za-z][A-Za-z0-9]*x[A-Z][A-Za-z0-9]*$"
    # THE FORM IS A CLAIM; THE PIN IS THE REFERENT. Matching the pattern is
    # necessary and NOT sufficient: the classifier returns this family only
    # when the project declares a pin on the neutral product below. This is
    # the one family here whose membership is not decided by the characters
    # alone, which is why it is the one family that carries `referent:`.
    requires_referent: true
    # The roles a DECLARED descendant may additionally answer in. The family
    # has no `roles:` of its own — `MedxGlass` and `MedxGlass-spec` are not
    # the same form — but a descendant that IS the repository an engineer
    # clones answers as the assembly root, which is what lets a descendant
    # carry legs. `spec` and `code` are absent on purpose: those names carry
    # the lowercase suffix and are ordinary project legs, descendants of
    # nothing.
    admits_declared_role:
      - assembly
    referent:
      # `MedxChart` -> product `Chart` -> `openChart`. The stem is greedy, so
      # a name with two `x<Upper>` splits is read at the rightmost one.
      split_pattern: "^(?P<stem>[A-Za-z][A-Za-z0-9]*)x(?P<product>[A-Z][A-Za-z0-9]*)$"
      canonical_template: "open{product}"
      # The neutral family admits an x-stem of its own (`openxFactory`), and
      # `codexFactory` descends from exactly that, so the x-stem spelling of
      # the referent counts too. Refusing it would be a spelling rule wearing
      # the costume of a semantic one.
      also_accepted:
        - "openx{product}"
      declared_by: >-
        A pin the project declares on the neutral product — in a scaffolded
        project, `contracts/<referent lowercased>-pin.yaml`, listed in
        `project.yaml`'s `neutral_product_pins:`. It is a fact in the
        project's own tree, so the check needs no network.
    description: >-
      A domain's descendant of a live product: an `x`-terminated domain stem
      immediately in front of the product name, AND a declared pin on that
      product. The stem's own first letter may be lowercase, which
      `codexFactory` already spends.
    # Each example is a descendant BECAUSE of the referent beside it, not
    # because of how it is spelled. `MedxChart` is a descendant because
    # MedxChart pins `openChart`; strip that pin and the same name is an
    # ordinary assembly root that also matches this form.
    example_referents:
      MedxChart: openChart
      LedgerxWallet: openWallet
      codexFactory: openxFactory
      # A descendant that is ALSO an assembly root with two legs. Both facts
      # at once is the case `admits_declared_role:` above exists for.
      MedxGlass: openGlass
    examples:
      - MedxChart
      - LedgerxWallet
      - codexFactory
      - MedxGlass
    # These do not even reach the referent question: they fail the pattern.
    counter_examples:
      - MedChart
      - Medx
    # And this one passes the pattern and is still NOT a descendant, because
    # nothing named `openScribe` is pinned. It is the pilot case, kept in the
    # data so the rule is testable from the contract rather than from memory.
    claim_without_referent_examples:
      - MedxScribe

  - id: project-leg
    precedence: 4
    title: Project leg
    pattern: "^[A-Za-z][A-Za-z0-9]*(?:-spec|-code)?$"
    description: >-
      One repository of a project that has elected the three-repository shape.
      The suffixes are fixed LOWERCASE and hyphenated precisely so they sit in
      a different visual class from every family above, all of which are
      CamelCase words; the assembly root is bare, following the precedent the
      aggregation root already sets — the thing you clone has no suffix.
    roles:
      - id: assembly
        pattern: "^[A-Za-z][A-Za-z0-9]*$"
        description: >-
          The per-project ROOT repository, the one an engineer clones. It
          carries `project.yaml`, the two legs as submodules, and the pins.
        examples:
          - Atlas
          - Northwind
      - id: spec
        pattern: "^[A-Za-z][A-Za-z0-9]*-spec$"
        description: The project's specification leg, mounted at `spec/`.
        examples:
          - Atlas-spec
          - Northwind-spec
      - id: code
        pattern: "^[A-Za-z][A-Za-z0-9]*-code$"
        description: The project's implementation leg, mounted at `code/`.
        examples:
          - Atlas-code
          - Northwind-code
    examples:
      - Atlas
      - Atlas-spec
      - Atlas-code
    counter_examples:
      - Atlas-SPEC
      - Atlas_spec
      - Atlas-tests

# The GitHub topic every repository of a project carries, so the organisation's
# own search surfaces the group without a checkout. It is the SECOND of the
# three agreeing layers of grouping (names, topics, register); where they
# disagree the register wins and the others are reported as drift, because the
# register is the only one of the three that is reviewed.
topic:
  template: "xf-project-{id}"
  pattern: "^xf-project-[a-z0-9][a-z0-9-]*$"
  id_pattern: "^[a-z0-9][a-z0-9-]*$"
  description: >-
    `xf-project-<id>` where `<id>` is the project's lowercase id, which is the
    same id an aggregation's `project-register.yaml` row uses.
  examples:
    - xf-project-atlas
    - xf-project-northwind

# The NEGATIVE half of the policy, as data rather than as an assumption.
# `counter_examples` above say "not THIS family" — several of them still land
# in the residual assembly-root class, which is the honest reading. These names
# match NO family at all and are what `validate-repository-naming.py` exits
# non-zero on.
unclassified_examples:
  - Atlas_spec
  - Atlas-tests
  - hermes-install
  - Keycloak-Installer
  - xFactory-Installer
  - 9Lives
  - "Atlas spec"
