name: validate

# The NEUTRAL gate: naming, manifest, lockstep pins. Nothing here needs a
# review lane, a wallet register or any overlay — a project with no overlays is
# fully conformant, and overlays attach to an existing shape rather than the
# reverse.
#
# It runs on PULL REQUESTS. So does the aggregation's, which is how seven
# consecutive pin-syncs that moved a gitlink alone went a day unnoticed:
# `main` never reports this check, and the breakage surfaces on somebody
# else's change. Read a green run here as "this pull request is in lockstep",
# never as "main is".

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    # The `secrets` context is NOT allowed in a step-level `if:` expression —
    # GitHub rejects the whole workflow file as unparseable the moment one
    # appears there ("unrecognized named-value 'secrets'"), and the failure
    # mode is not a red step but a push-event run with ZERO jobs: this was
    # the defect on the first real projects (MedxSoft/MedxEHR #8,
    # MedxSoft/MedxGlass #1). `secrets` IS allowed in `env:`, so the presence
    # check is done here, once, and the guarded step below reads the
    # resulting `env.*` boolean instead of `secrets.*` directly.
    env:
      SHAPE_LEGS_TOKEN_SET: ${{ secrets.SHAPE_LEGS_TOKEN != '' }}
    steps:
      # The ROOT repository is always readable by the workflow's own default
      # token, so this checkout never carries `token:` — no override, no
      # dependency on SHAPE_LEGS_TOKEN at all. That was the defect (first
      # real use, MedxSoft/MedxEHR and MedxSoft/MedxGlass, runs 33821509948
      # and 33821512605): `token: ${{ secrets.SHAPE_LEGS_TOKEN ||
      # github.token }}` put a legs-scoped token onto the ROOT checkout, so a
      # token correctly scoped to `contents:read` on the legs alone (or a
      # mis-scoped/unapproved one) made `actions/checkout` itself fail with a
      # 403 before any check ran. `persist-credentials: false` keeps that
      # token out of the local git config entirely, so the submodule step
      # below authenticates the legs on its own terms instead of inheriting
      # anything from this step.
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      # Best-effort, and its failure is CAPTURED rather than let through as a
      # step failure: a private leg with no `SHAPE_LEGS_TOKEN` configured is a
      # DEGRADE (see the two guarded steps below), never a red
      # `actions/checkout`. That was the earlier defect: `submodules: true`
      # on checkout hard-fails the whole job the moment a leg cannot be
      # cloned, with no route to run the checks that do not need the legs at
      # all.
      #
      # `SHAPE_LEGS_TOKEN` is scoped to THIS STEP alone via `env:` — never to
      # the job, never onto the root checkout above — and is used only
      # through a scoped `git -c url.<...>.insteadOf=<...>` rewrite, never
      # echoed or interpolated into a URL that gets printed. Two rewrites
      # cover both submodule URL forms an adopted repository may carry:
      # `https://github.com/...` and SSH `git@github.com:...`. With no
      # secret configured this falls back to a plain, unauthenticated
      # `git submodule update --init --recursive` — the same command that
      # already ran here, unchanged, for a project whose legs are public.
      - name: fetch the legs (submodules)
        id: submodules
        env:
          SHAPE_LEGS_TOKEN: ${{ secrets.SHAPE_LEGS_TOKEN }}
        run: |
          set +e
          if [ -n "$SHAPE_LEGS_TOKEN" ]; then
            git \
              -c "url.https://x-access-token:${SHAPE_LEGS_TOKEN}@github.com/.insteadOf=https://github.com/" \
              -c "url.https://x-access-token:${SHAPE_LEGS_TOKEN}@github.com/.insteadOf=git@github.com:" \
              submodule update --init --recursive
          else
            git submodule update --init --recursive
          fi
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "legs_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "legs_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::submodule checkout failed (git exit $status). If the legs are PRIVATE or internal sibling repositories, the default GITHUB_TOKEN cannot read them. Set SHAPE_LEGS_TOKEN — a fine-grained PAT or GitHub App installation token with contents:read on the legs — as a repository or organisation secret. Leg URLs:"
            git config --file .gitmodules --get-regexp '\.url$' | while read -r _ url; do
              echo "::warning::  $url"
            done
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Standard library only. If this ever needs a `pip install`, the change
      # is wrong: the shape must run in an org that cannot install anything.
      # Neither of these two reads a leg's working tree, so both run
      # regardless of whether the legs were fetched above.
      - name: naming policy
        run: python3 scripts/validate-repository-naming.py --project project.yaml

      - name: project manifest
        run: python3 scripts/validate-manifest.py

      # The pin validator recomputes each leg's tree digest FROM the leg's own
      # object store, so it needs the leg actually checked out — it REFUSES
      # rather than passing on an uninitialized submodule, because an
      # unreadable surface must fail rather than degrade. Running it only
      # when the fetch above succeeded turns that refusal into a clean,
      # explained skip instead of a job failure with no route around it.
      - name: lockstep pins
        if: steps.submodules.outputs.legs_available == 'true'
        run: python3 scripts/validate-pins.py

      - name: lockstep pins (skipped — legs unavailable)
        if: steps.submodules.outputs.legs_available != 'true'
        run: |
          echo "::warning::lockstep pin check SKIPPED: the legs could not be checked out, so their trees are not available to recompute the digests in contracts/*-pin.yaml against. See the 'fetch the legs (submodules)' step above for why."

      # Misconfiguration must not be silent. An absent SHAPE_LEGS_TOKEN
      # degrading a project with private legs is expected and reported above;
      # a PRESENT SHAPE_LEGS_TOKEN that still could not check out the legs
      # (wrong scope, missing contents:read grant, a leg URL problem) is a
      # finding a human must act on, so this fails the job — the only case
      # that does. The root checkout above never depended on this token, so
      # a failure here can only mean the token cannot read one of the LEG
      # repositories named below.
      - name: fail — SHAPE_LEGS_TOKEN is set but the legs still could not be fetched
        if: steps.submodules.outputs.legs_available != 'true' && env.SHAPE_LEGS_TOKEN_SET == 'true'
        run: |
          echo "::error::SHAPE_LEGS_TOKEN is configured but 'git submodule update --init --recursive' still failed. The root checkout does not use this token — it reads with the workflow's default token — so this means SHAPE_LEGS_TOKEN cannot read one or more of the following LEG repositories (wrong token scope, a missing contents:read grant, or a leg URL problem):"
          git config --file .gitmodules --get-regexp '\.url$' | while read -r _ url; do
            echo "::error::  $url"
          done
          exit 1
